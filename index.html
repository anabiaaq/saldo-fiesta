<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salão Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: barra fina no topo, trilho de 5 passos à esquerda e o salão ocupando o resto. Tudo branco e grafite; a cor fica para o salão. */
:root{
  color-scheme:light;
  --bg:#f5f5f4; --surface:#ffffff; --fill:#f2f2f1; --hover:#ebebea; --line:#e4e4e2;
  --ink:#1c1c1e; --muted:#6b6b70; --accent:#3a66d6;
  --ok:#2e7d55; --warn:#a86a12; --err:#c8372d;
  --ui:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,20,25,.06),0 8px 28px rgba(20,20,25,.1);
  --rail:76px; --bar:56px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3{margin:0;font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
input[type=range]{padding:0;border:0;accent-color:var(--ink);height:22px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);flex:none}
textarea{resize:vertical;min-height:84px}

/* Topo */
#top{position:absolute;top:0;left:0;right:0;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 var(--gut-r) 0 var(--gut-l);background:var(--surface);border-bottom:1px solid var(--line);z-index:8}
.tl,.tr{display:flex;align-items:center;gap:6px;min-width:0}
.tr{justify-content:flex-end}
.logo{font-weight:600;letter-spacing:-.01em;white-space:nowrap;margin-right:10px}
.proj{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;min-width:0;color:var(--muted)}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj:hover{background:var(--fill);color:var(--ink)}
.proj svg{width:15px;height:15px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 18px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#saved{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:6px}
#pill{font-size:13px;color:var(--muted);white-space:nowrap;margin-right:6px;font-variant-numeric:tabular-nums}
#pill b{color:var(--ink);font-weight:500}
.tbtn{height:36px;min-width:36px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--fill)}
.tbtn:disabled{opacity:.3;cursor:default;background:none}

/* Trilho */
#rail{position:absolute;left:0;top:var(--bar);bottom:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 7px;z-index:7}
#rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:10px;font-size:11.5px;color:var(--muted)}
#rail button:hover{background:var(--fill);color:var(--ink)}
#rail button.on{background:var(--ink);color:#fff}
#rail .n{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--err)}
#rail .n.w{background:#e3a43a}

/* Painel */
#side{position:absolute;left:var(--rail);top:var(--bar);bottom:0;width:330px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:6}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px 20px;flex:none}
.shead h2{font-size:19px;letter-spacing:-.015em}
.close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.close:hover{background:var(--fill);color:var(--ink)}
#panel{flex:1;overflow-y:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:20px;min-height:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3,.h{font-size:13px;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0}
.lab{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{padding:11px 14px;border-radius:10px;background:var(--ink);color:#fff;font-weight:500;text-align:center;display:block;width:100%;cursor:pointer}
.btn:hover{background:#000}
.btn.alt{background:var(--fill);color:var(--ink)}
.btn.alt:hover{background:var(--hover)}
.btn.bad{background:none;color:var(--err);border:1px solid var(--line)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{padding:6px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.pills button:hover{background:var(--fill)}
.pills button.on{background:var(--ink);color:#fff}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--fill);border-radius:10px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;line-height:1.25;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card:hover{background:var(--hover)}
.card svg{width:44px;height:36px;flex:none}
.card small{color:var(--muted);font-size:12px}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.look{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;font-size:13px}
.look:hover{border-color:var(--ink)}
.look.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.look div{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.look i{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.14)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{padding:8px 6px;background:var(--fill);border-radius:8px;font-size:13px}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--ink);color:#fff}
details{border-top:1px solid var(--line)}
details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-weight:500}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--muted);font-size:18px;font-weight:300;line-height:1}
details[open]>summary::after{content:"–"}
details>.in{display:flex;flex-direction:column;gap:14px;padding:0 0 16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--fill);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:21px;font-weight:500;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict{border-radius:12px;padding:14px;background:var(--fill)}
.verdict b{display:block;font-size:17px;font-weight:500;letter-spacing:-.01em}
.verdict span{color:var(--muted);font-size:13px}
.issue{display:flex;gap:10px;padding:11px 0;text-align:left;width:100%;align-items:flex-start;border-bottom:1px solid var(--line)}
.issue i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.issue.err i{background:var(--err)}.issue.warn i{background:#e3a43a}.issue.info i{background:#b4b4b8}
.issue b{display:block;font-weight:500}
.issue span{color:var(--muted);font-size:13px}
.gitem{display:grid;grid-template-columns:auto 1fr 78px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.gitem span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem small{display:block;color:var(--muted);font-size:12px}
.gitem select{padding:5px;font-size:12.5px}
.x{color:var(--muted);padding:2px 6px}
.x:hover{color:var(--err)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--fill);max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;font-size:11px;color:#fff;background:rgba(0,0,0,.55)}
.photo button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px}
.ex{font-size:12.5px;color:var(--muted);background:var(--fill);padding:8px 10px;border-radius:8px;margin:0}

/* Palco do 3D */
#stage{position:absolute;left:var(--rail);top:var(--bar);right:0;bottom:0;overflow:hidden;background:var(--bg)}
#view,#plan2d{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#view{touch-action:none;cursor:grab}
#view.grabbing{cursor:grabbing}
#plan2d{pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}
.tag.near{font-size:12.5px;background:var(--ink);color:#fff;padding:3px 9px;border-radius:7px;margin-top:-40px}
#marq{position:absolute;border:1px solid var(--accent);background:rgba(58,102,214,.1);z-index:3;pointer-events:none}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .22s;z-index:4}
#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--muted);z-index:3;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint b{color:var(--ink);font-weight:500;margin-right:8px}
#mini{position:absolute;left:16px;top:16px;width:168px;height:168px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);z-index:4;cursor:pointer}
#pad{position:absolute;right:var(--gut-r);bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:4;user-select:none;-webkit-user-select:none}
.padbox{background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:5px;display:grid;gap:2px}
.padbox.arrows{grid-template-columns:repeat(3,38px);grid-auto-rows:38px}
.padbox.line{grid-auto-flow:column;grid-auto-columns:auto;grid-auto-rows:38px}
.pb{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:0 9px;font-size:13px;font-weight:500;touch-action:none;white-space:nowrap}
.pb:hover{background:var(--fill)}
.pb.on{background:var(--ink);color:#fff}
.pb:active{background:var(--hover)}
#rooms{position:absolute;left:16px;right:190px;bottom:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3}
#rooms::-webkit-scrollbar{display:none}
#rooms button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px}
#rooms button:hover{background:var(--fill)}
#insp{position:absolute;right:var(--gut-r);top:16px;max-height:calc(100% - 32px);width:286px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;z-index:5}
.ihead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#insp h2{font-size:17px;letter-spacing:-.01em}
#insp .type{color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;justify-content:space-between}
.step .ctl{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:10px;padding:3px}
.step .ctl button{width:32px;height:32px;border-radius:8px;font-size:18px;font-weight:300}
.step .ctl button:hover{background:var(--surface)}
.step .ctl b{min-width:30px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:10px;background:var(--fill);font-size:12px}
.acts button:hover{background:var(--hover)}
.slide{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:13px;color:var(--muted)}
.slide output{color:var(--ink);font-variant-numeric:tabular-nums}
.slide input{grid-column:1/-1}
.seat{display:flex;justify-content:space-between;gap:6px;padding:4px 0;font-size:13.5px}
#toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:9;max-width:min(440px,90%);text-align:center;font-size:13.5px}
.modal{position:absolute;inset:0;background:rgba(20,20,25,.35);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:min(560px,100%);max-height:100%;overflow:auto;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:20px;letter-spacing:-.015em}
.modal img{width:100%;border-radius:10px;display:block}
.plist{display:flex;flex-direction:column}
.plist button{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:8px;text-align:left}
.plist button:hover{background:var(--fill)}
.plist button.on{background:var(--fill);font-weight:500}
.plist small{color:var(--muted);white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.keys b{font-weight:500}
#fatal,#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);z-index:20}
#load{z-index:15;font-size:15px;color:var(--muted);transition:opacity .4s}

@media (max-width:1280px){#saved{display:none}}
@media (max-width:1100px){#pill{display:none}.seg button{padding:6px 12px}}
@media (max-width:760px){
  :root{--rail:0px;--bar:52px}
  #top{grid-template-columns:auto 1fr auto;padding-left:var(--gut-l)}
  .logo,.proj span,.tbtn span{display:none}
  .seg{justify-self:center}.seg button{padding:6px 10px;font-size:13px}
  .tr #undo,.tr #help{display:none}
  #rail{top:auto;left:0;right:0;bottom:0;width:auto;height:60px;flex-direction:row;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  #rail button{flex:1;padding:5px 0 3px;font-size:11px}
  #stage{bottom:60px}
  #side{left:0;right:0;width:auto;top:auto;bottom:60px;height:52%;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  #insp{left:0;right:0;width:auto;top:auto;bottom:0;max-height:62%;border-radius:14px 14px 0 0;padding-left:var(--gut-l);padding-right:var(--gut-r)}
  #mini{width:96px;height:96px;left:var(--gut-l);top:54px}
  #rooms{left:var(--gut-l);right:var(--gut-r);bottom:calc(100% - 96px);display:none}
  #hint{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){#fade,#load{transition:none}}
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="tl">
      <div class="logo">Salão Vivo</div>
      <button class="proj" id="projBtn" title="Trocar de projeto"><span id="projName"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div id="saved" role="status"></div>
    </div>
    <div class="seg" role="tablist" aria-label="Modo de visualização">
      <button data-mode="planta">Planta</button>
      <button data-mode="orbita">3D</button>
      <button data-mode="walk">Caminhar</button>
    </div>
    <div class="tr">
      <div id="pill"></div>
      <button class="tbtn" id="undo" title="Desfazer" aria-label="Desfazer"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tbtn" id="redo" title="Refazer" aria-label="Refazer"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button class="tbtn" id="exportBtn" title="Salvar imagem ou lista"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 15v4a1 1 0 001 1h12a1 1 0 001-1v-4"/></svg><span>Exportar</span></button>
      <button class="tbtn" id="help" title="Como usar" aria-label="Como usar">?</button>
    </div>
  </header>

  <nav id="rail" aria-label="Passos"></nav>

  <main id="stage">
    <canvas id="view" tabindex="0" aria-label="Salão em 3D"></canvas>
    <canvas id="plan2d" hidden></canvas>
    <div id="tags"></div>
    <div id="marq" hidden></div>
    <div id="fade"></div>
    <div id="hint" role="status"></div>
    <canvas id="mini" width="336" height="336" hidden aria-label="Mapa: clique para ir até o ponto"></canvas>
    <div id="rooms"></div>
    <div id="pad"></div>
    <section id="insp" hidden aria-label="Item selecionado"></section>
    <div id="toast" hidden role="status"></div>
  </main>

  <aside id="side">
    <div class="shead"><h2 id="sideTitle"></h2><button class="close" id="sideClose" aria-label="Fechar painel"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="panel"></div>
  </aside>

  <div id="modal" class="modal" hidden></div>
  <div id="load">Abrindo o salão…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number(n).toFixed(d).replace('.',',');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,9);
const rad=d=>d*Math.PI/180;
function seeded(s){let h=1779033703;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

/* ───────── Catálogo ───────── */
const CAT={
  round120:{name:'Redonda 1,20 m',group:'Mesas',shape:'round',r:.6,h:.76,seats:6,min:2,max:8,dining:1},
  round150:{name:'Redonda 1,50 m',group:'Mesas',shape:'round',r:.75,h:.76,seats:8,min:4,max:10,dining:1},
  round180:{name:'Redonda 1,80 m',group:'Mesas',shape:'round',r:.9,h:.76,seats:10,min:6,max:12,dining:1},
  square:{name:'Quadrada 1,10 m',group:'Mesas',shape:'rect',w:1.1,d:1.1,h:.76,seats:4,min:2,max:8,dining:1},
  rect:{name:'Retangular',group:'Mesas',shape:'rect',w:2.4,d:.95,h:.76,seats:8,min:4,max:14,dining:1,resize:1},
  imperial:{name:'Imperial',group:'Mesas',shape:'rect',w:5.4,d:1.15,h:.76,seats:18,min:8,max:30,dining:1,resize:1},

  const push=(level,title,detail,ids=[])=>{issues.push({level,title,detail,ids});if(level!=='info'&&level!=='ok')mark(ids,level)};

    if(!room||!room.place||!P.every(p=>p[0]>=room.x0-.02&&p[0]<=room.x1+.02&&p[1]>=room.z0-.02&&p[1]<=room.z1+.02))push('err','Fora do ambiente',`${name(it)} passa da parede ou está fora de uma área liberada.`,[it.id]);

    else if(onStage(it)&&!P.every(p=>p[0]>=stage.x0&&p[0]<=stage.x1&&p[1]>=stage.z0&&p[1]<=stage.z1))push('err','Saindo do palco',`Parte de ${name(it)} está além da borda do palco.`,[it.id]);
    if(!CAT[it.type].flat&&!onStage(it))for(const p of pista)if(satOverlap(P,polys.get(p.id).foot)){push('warn','Sobre a pista',`${name(it)} está ocupando a pista de dança.`,[it.id]);break}
  }

  /* Convidados */
  const cap=new Map(items.map(i=>[i.id,seatsOf(i)]));
  const noTable=plan.guests.filter(g=>!cap.has(g.table));
  if(noTable.length)push('warn',`${noTable.length} convidados sem mesa`,'Abra a aba Convidados e distribua pelo salão.');
  for(const t of diningTables()){const n=guestsAt(t.id).length;if(n>seatsOf(t))push('err','Mesa com convidados demais',`${name(t)} tem ${n} convidados para ${seatsOf(t)} cadeiras.`,[t.id]);}

}

/* Teclado */
window.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.target.type!=='range';
  if(e.key==='Escape'){if(!$('#modal').hidden)return closeModal();if(measuring)$('#pad [data-pad=measure]')?.click();selectOnly(null);return}
  if(typing)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.code==='KeyY'){e.preventDefault();redo();return}
  if(mod&&e.code==='KeyD'){e.preventDefault();dupSel();return}
  if(mod)return;
  const arrow=/Arrow/.test(e.code);
  if(mode==='walk'||(mode==='orbita'&&!sel.size)){keys[e.code]=true;if(arrow)e.preventDefault();invalidate()}
  if(e.code==='Digit1')setMode('planta');if(e.code==='Digit2')setMode('orbita');if(e.code==='Digit3')setMode('walk');
  if((e.key==='Delete'||e.key==='Backspace')&&sel.size){e.preventDefault();removeSel()}
  if(e.code==='KeyR'&&sel.size)rotSel(e.shiftKey?-15:15);
  if(mode!=='walk'&&sel.size&&arrow){e.preventDefault();const s=e.shiftKey?.5:.05;nudge(e.code==='ArrowLeft'?-s:e.code==='ArrowRight'?s:0,e.code==='ArrowUp'?-s:e.code==='ArrowDown'?s:0)}
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{keys={};hold={}});

const plan2d=$('#plan2d'),pc=plan2d.getContext('2d');
function sizePlan(){const s=$('#stage'),d=Math.min(devicePixelRatio||1,2);plan2d.width=s.clientWidth*d;plan2d.height=s.clientHeight*d;plan2d._d=d}
const PC={bg:'#f5f5f4',room:'#ffffff',wall:'#232326',glass:'#8fa3b5',line:'#1c1c1e',soft:'#d9d9d6',chair:'#c9c9c6',fill:'#f0f0ee',text:'#1c1c1e',muted:'#7a7a7f',grid:'#f1f1ef',sel:'#3a66d6',err:'#c8372d',warn:'#d8922a'};
function drawPlan(){
  camera.updateMatrixWorld();
  const d=plan2d._d||1,cw=plan2d.width/d,ch=plan2d.height/d,x=pc;x.setTransform(d,0,0,d,0,0);x.fillStyle=PC.bg;x.fillRect(0,0,cw,ch);
  _v.set(0,0,0).project(camera);const ox=(_v.x*.5+.5)*cw,oy=(-_v.y*.5+.5)*ch;_v.set(1,0,0).project(camera);const S=(_v.x*.5+.5)*cw-ox,X=a=>ox+a*S,Y=b=>oy+b*S,v=V();
  const font=(s,w=400)=>`${w} ${s}px Geist,-apple-system,"Helvetica Neue",Arial,sans-serif`;
  const text=(t,a,b,s,c=PC.text,w=400)=>{x.font=font(s,w);x.fillStyle=c;x.textAlign='center';x.textBaseline='middle';x.fillText(t,a,b)};
  const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
  rooms.forEach(r=>{x.fillStyle=PC.room;x.fillRect(X(r.x0),Y(r.z0),(r.x1-r.x0)*S,(r.z1-r.z0)*S)});
  /* grade de 1 m */
  if(S>9){const h=rooms[0];x.strokeStyle=PC.grid;x.lineWidth=1;x.beginPath();for(let a=Math.ceil(h.x0);a<h.x1;a++){x.moveTo(X(a),Y(h.z0));x.lineTo(X(a),Y(h.z1))}for(let b=Math.ceil(h.z0);b<h.z1;b++){x.moveTo(X(h.x0),Y(b));x.lineTo(X(h.x1),Y(b))}x.stroke()}
  const st=stageRect();x.fillStyle=PC.fill;x.fillRect(X(st.x0),Y(st.z0),(st.x1-st.x0)*S,(st.z1-st.z0)*S);x.strokeStyle=PC.soft;x.lineWidth=1;x.strokeRect(X(st.x0),Y(st.z0),(st.x1-st.x0)*S,(st.z1-st.z0)*S);
  /* móveis fixos dos ambientes */
  x.fillStyle=PC.fill;x.strokeStyle=PC.soft;colliders.forEach(c=>{if(c.wall)return;const w=(c.x1-c.x0)*S,h=(c.z1-c.z0)*S;x.fillRect(X(c.x0),Y(c.z0),w,h);x.strokeRect(X(c.x0),Y(c.z0),w,h)});
  /* paredes, vidros e portas */
  x.fillStyle=PC.wall;planW.forEach(r=>x.fillRect(X(r.x0),Y(r.z0),Math.max(1.5,(r.x1-r.x0)*S),Math.max(1.5,(r.z1-r.z0)*S)));
  x.fillStyle=PC.glass;planG.forEach(r=>x.fillRect(X(r.x0),Y(r.z0),Math.max(1.5,(r.x1-r.x0)*S),Math.max(1.5,(r.z1-r.z0)*S)));
  x.strokeStyle='#a9a9ad';x.lineWidth=1;planD.forEach(o=>{const a0=Math.atan2(o.uz,o.ux),r=o.w*S;x.beginPath();x.arc(X(o.x),Y(o.z),r,a0,a0+o.dir*Math.PI/2,o.dir<0);x.stroke();x.beginPath();x.moveTo(X(o.x),Y(o.z));const a1=a0+o.dir*Math.PI/2;x.lineTo(X(o.x)+Math.cos(a1)*r,Y(o.z)+Math.sin(a1)*r);x.stroke()});
  /* cotas */
  const dim=(ax,ay,bx,by,t)=>{x.strokeStyle='#a9a9ad';x.lineWidth=1;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();const nx=by-ay?5:0,ny=by-ay?0:5;[[ax,ay],[bx,by]].forEach(([p,q])=>{x.beginPath();x.moveTo(p-nx,q-ny);x.lineTo(p+nx,q+ny);x.stroke()});const mx=(ax+bx)/2,my=(ay+by)/2;x.font=font(12,500);const w=x.measureText(t).width+12;x.fillStyle=PC.room;x.fillRect(mx-w/2,my-9,w,18);text(t,mx,my,12,PC.muted,500)};
  dim(X(-v.W/2+.1),Y(v.L/2-.5),X(v.W/2-.1),Y(v.L/2-.5),fmt(v.W)+' m');dim(X(v.W/2-.5),Y(-v.L/2+.1),X(v.W/2-.5),Y(v.L/2-.1),fmt(v.L)+' m');
  /* itens */
  for(const it of plan.items.slice().sort((a,b)=>(CAT[b.type].flat?1:0)-(CAT[a.type].flat?1:0))){
    const c=CAT[it.type],D=dims(it),s=sel.has(it.id),R=rt.get(it.id),st_=R&&R.state;
    if(s||st_){x.beginPath();worldPoly(it,true).forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.closePath();x.fillStyle=s?'rgba(58,102,214,.1)':st_==='err'?'rgba(200,55,45,.1)':'rgba(216,146,42,.12)';x.fill();x.strokeStyle=s?PC.sel:st_==='err'?PC.err:PC.warn;x.lineWidth=1.5;x.stroke()}
    x.save();x.translate(X(it.x),Y(it.z));x.rotate(-rad(it.rot||0));
    for(const sp of (seatsOf(it)?chairSpots(it):[])){x.save();x.translate(sp.x*S,sp.z*S);x.rotate(-sp.rot);const w=.36*S;x.fillStyle=PC.chair;rr(-w/2,-w/2,w,w,w*.22);x.fill();x.restore()}
    x.lineWidth=1.2;x.strokeStyle=PC.line;x.fillStyle=PC.room;
    const body=()=>{if(c.shape==='round'){x.beginPath();x.arc(0,0,c.r*S,0,6.2832)}else rr(-D.w/2*S,-D.d/2*S,D.w*S,D.d*S,1.5);x.fill();x.stroke()};
    const name=(t,sz=11)=>{if(D.w*S>t.length*sz*.55)text(t,0,0,sz,PC.muted)};
    if(it.type==='pista'){x.fillStyle=PC.fill;rr(-D.w/2*S,-D.d/2*S,D.w*S,D.d*S,0);x.fill();x.lineWidth=1;x.strokeStyle=PC.soft;x.stroke();x.strokeStyle='#c9c9c6';x.strokeRect((-D.w/2+.25)*S,(-D.d/2+.25)*S,(D.w-.5)*S,(D.d-.5)*S);text('Pista de dança',0,0,13,PC.muted)}
    else if(c.rows){x.fillStyle=PC.fill;x.fillRect(-.55*S,-D.d/2*S,1.1*S,D.d*S)}
    else if(c.single){}
    else if(it.type==='lounge'){x.lineWidth=1;x.strokeStyle=PC.soft;x.fillStyle=PC.fill;rr(-D.w/2*S,-D.d/2*S,D.w*S,D.d*S,3);x.fill();x.stroke();x.fillStyle=PC.room;x.strokeStyle=PC.line;[[-1.1,-D.d/2+.1,2.2,.8],[-D.w/2+.1,-.4,.8,1.3],[D.w/2-.9,-.4,.8,1.3]].forEach(([a,b,w,h])=>{rr(a*S,b*S,w*S,h*S,3);x.fill();x.stroke()});x.beginPath();x.arc(0,.25*S,.42*S,0,6.2832);x.fill();x.stroke()}
    else if(it.type==='arco'){x.fillStyle='transparent';x.beginPath();x.moveTo(-D.w/2*S,0);x.lineTo(D.w/2*S,0);x.lineWidth=2.5;x.stroke();[-1,1].forEach(k=>{x.beginPath();x.arc(k*D.w/2*S,0,3,0,6.2832);x.fillStyle=PC.line;x.fill()})}
    else if(it.type==='arranjo'||it.type==='arvore'){const n=9;x.fillStyle=it.type==='arvore'?'#dfe3dc':'#f1e3df';x.strokeStyle=PC.soft;x.lineWidth=1;x.beginPath();x.arc(0,0,c.r*S*1.25,0,6.2832);x.fill();x.stroke();x.fillStyle=PC.muted;x.beginPath();x.arc(0,0,Math.max(1.5,.07*S),0,6.2832);x.fill()}
    else{body();if(c.dining){const lb=shortLabel(it);if(lb){const sz=clamp(Math.min(D.w,D.d)*S*.42,9,17);if(D.d*S>13)text(lb,0,0,CAT[it.type].head?Math.min(sz,12):sz,PC.text,500)}}else name(c.name)}
    x.restore();
  }
  /* nomes dos ambientes */
  areaTags.forEach(t=>{text(t[0].toUpperCase(),X(t[1]),Y(t[2]),11,PC.muted,500)});
  if(measurePts.length){x.strokeStyle=PC.sel;x.fillStyle=PC.sel;x.lineWidth=1.5;if(measurePts.length===2){x.beginPath();x.moveTo(X(measurePts[0].x),Y(measurePts[0].z));x.lineTo(X(measurePts[1].x),Y(measurePts[1].z));x.stroke()}measurePts.forEach(p=>{x.beginPath();x.arc(X(p.x),Y(p.z),4,0,6.2832);x.fill()})}
}

  const v=V(),hz=v.L/2,hx=v.W/2,add=(t,x,z,o={})=>{const it=newItem(t,x,z);Object.assign(it,o);plan.items.push(it);return it};
  add('pista',0,-hz+v.stageD+5,{w:9,d:8});add('noivos',0,-hz+2.6);add('dj',-3.8,-hz+1.4);
  add('bar',-hx+1.3,-hz+11.5,{rot:90,w:4.5});add('buffet',hx-1.1,-hz+7.2,{rot:90,w:4.2});add('bolo',hx-2.2,-hz+3.4);
  add('arco',0,-hz+.9);add('arranjo',-4.9,-hz+v.stageD+.45);add('arranjo',4.9,-hz+v.stageD+.45);
  add('arvore',-hx+1,-hz+1.2);add('arvore',hx-1,-hz+1.2);add('lounge',3.4,hz+4.5,{rot:90});add('cabine',-hx+1.3,hz-7,{rot:90});
  add('lounge',hx+6,-3,{rot:0});add('bistro',hx+6,5);add('bistro',hx+6,9);add('arvore',hx+1.2,-hz+3.5);
  autoLayout({type:'round150',pattern:'esc',corridor:.9,count:21});assignGuests();
}

/* ───────── Início ───────── */
function setup(p){plan=p;lastSnap='';buildVenue()}
(async function boot(){
  resize();
  setup(samplePlan());seedSample();lastSnap=JSON.stringify(plan);sync();renderAll();uiHist();
  {const[p0,t0]=homeCam();camera.position.copy(p0);orbit.target.copy(t0);orbit.update()}
  setMode('orbita');
  requestAnimationFrame(loop);
  setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),400)},60);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{updateMonogram();for(const[id,R]of rt)R.sig='';sync()});
  await store.init();
  const l=store.list();if(l.length)openPlan(JSON.parse(JSON.stringify(l[0])));
  $('#saved').textContent=store.db?'Salvo na nuvem':'Salvo neste navegador';renderPlanSel();
})();
</script>
